name: Build Namecheap package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/.htaccess
          echo "Static export is ready for Namecheap public_html."

      - name: Create Namecheap ZIP
        run: |
          cd out
          zip -r ../m3e-canvas-namecheap-public_html.zip .

      - name: Upload Namecheap ZIP
        uses: actions/upload-artifact@v5
        with:
          name: m3e-canvas-namecheap-public_html
          path: m3e-canvas-namecheap-public_html.zip
          if-no-files-found: error
          retention-days: 14
